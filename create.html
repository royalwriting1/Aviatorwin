<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create App - BuildGenius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🚀</span>
                <h1 class="text-2xl font-bold">BuildGenius AI</h1>
            </div>
            <div class="flex space-x-4">
                <a href="index.html" class="px-4 py-2 bg-blue-600 rounded-lg">Home</a>
                <a href="create.html" class="px-4 py-2 bg-green-600 rounded-lg">Create App</a>
                <a href="myapps.html" class="px-4 py-2 bg-purple-600 rounded-lg">My Apps</a>
                <a href="assistant.html" class="px-4 py-2 bg-gradient-to-r from-green-500 to-blue-500 rounded-lg flex items-center">
                    <i class="fas fa-robot mr-2"></i>AI Assistant
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-8 max-w-4xl">
        <h1 class="text-4xl font-bold mb-8 text-center">Create Your App</h1>
        
        <div class="bg-gray-800 rounded-xl p-8 border border-gray-700">
            <textarea 
                id="app-prompt" 
                class="w-full h-48 p-4 bg-gray-700 rounded-lg text-white placeholder-gray-400 border border-gray-600 resize-none"
                placeholder="Example: Create a todo list app with dark theme, add/delete tasks, local storage"
            ></textarea>
            
            <div class="mt-6 flex justify-center">
                <button onclick="generateApp()" class="bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 px-8 py-4 rounded-lg text-xl font-bold transition">
                    <i class="fas fa-rocket mr-2"></i>Generate App with AI
                </button>
            </div>
        </div>
    </div>

    <script>
        function generateApp() {
            const prompt = document.getElementById('app-prompt').value;
            if (!prompt.trim()) {
                alert('Please describe your app first!');
                return;
            }
            
            localStorage.setItem('currentAppPrompt', prompt);
            window.location.href = 'assistant.html';
        }
    </script>
</body>
</html>
