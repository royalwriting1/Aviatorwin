<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - BuildGenius</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-container { height: calc(100vh - 200px); }
        .message { max-width: 80%; margin-bottom: 15px; }
        .user-message { margin-left: auto; background: #3b82f6; color: white; padding: 12px; border-radius: 12px; }
        .ai-message { background: #374151; color: white; padding: 12px; border-radius: 12px; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🚀</span>
                <h1 class="text-xl font-bold">BuildGenius AI</h1>
            </div>
            <a href="index.html" class="px-3 py-2 bg-blue-600 rounded-lg text-sm">Home</a>
        </div>
    </nav>

    <div class="p-4">
        <h1 class="text-2xl font-bold mb-2 text-center">AI Assistant</h1>
        <p class="text-gray-400 text-center mb-4">Mobile Optimized</p>
        
        <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
            <div id="chat-messages" class="h-64 overflow-y-auto p-2 space-y-2 mb-4">
                <div class="ai-message">
                    <strong>AI:</strong> Describe your app, I'll generate code!
                </div>
            </div>

            <div class="border-t border-gray-700 pt-3">
                <div class="flex space-x-2">
                    <input 
                        type="text" 
                        id="chat-input"
                        placeholder="Type your app idea..."
                        class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm"
                    >
                    <button onclick="sendMessage()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-semibold transition">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Debug Info -->
        <div id="debug" class="mt-4 p-2 bg-yellow-900 rounded text-xs hidden"></div>
    </div>

    <script>
        // Debug function for mobile
        function debug(msg) {
            console.log(msg);
            const debugDiv = document.getElementById('debug');
            debugDiv.innerHTML += msg + '<br>';
            debugDiv.classList.remove('hidden');
        }

        // Mobile-friendly send function
        async function sendMessage() {
            debug('Send button clicked');
            
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) {
                alert('Please type something!');
                return;
            }

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            try {
                debug('Calling AI...');
                
                // Use CORS proxy for mobile
                const response = await callAIWithProxy(message);
                
                debug('AI Response received');
                addMessage(response, 'ai');
                
            } catch (error) {
                debug('Error: ' + error.message);
                addMessage("Sorry, connection issue. Try again!", 'ai');
            }
        }

        // CORS Proxy Solution for Mobile
        async function callAIWithProxy(userMessage) {
            // Method 1: Direct API call (might work on some mobile browsers)
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer 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',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{
                            role: 'user', 
                            content: 'Create a simple HTML app: ' + userMessage
                        }],
                        model: 'llama3-8b-8192',
                        max_tokens: 1000
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    return data.choices[0].message.content;
                } else {
                    throw new Error('API failed: ' + response.status);
                }
            } catch (error) {
                debug('Direct API failed: ' + error.message);
                // Fallback to simple response
                return generateSimpleResponse(userMessage);
            }
        }

        // Fallback response generator
        function generateSimpleResponse(prompt) {
            return `I'll create that for you! Here's a simple app:\n\n` +
                   `Visit on desktop for full AI features, or use this template:\n\n` +
                   `📱 Simple Mobile App Template:\n` +
                   `- HTML5 Structure\n` +
                   `- Responsive Design\n` +
                   `- Mobile Optimized\n` +
                   `- Fast Loading`;
        }

        function addMessage(content, sender) {
            const messages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = `<strong>${sender === 'user' ? 'You' : 'AI'}:</strong> ${content}`;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        // Mobile touch events
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initialize
        debug('Page loaded - Mobile version');
    </script>
</body>
</html>
